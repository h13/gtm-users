version: "2"

formatters:
  enable:
    - gofmt
    - goimports

linters:
  enable:
    - bodyclose
    - copyloopvar
    - dupl
    - errname
    - exhaustive
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - gosec
    - misspell
    - nakedret
    - nilerr
    - prealloc
    - predeclared
    - revive
    - unconvert
    - unparam
    - whitespace

  settings:
    gocyclo:
      min-complexity: 15
    gocognit:
      min-complexity: 20
    goconst:
      min-len: 3
      min-occurrences: 3
      # Test files are already excluded from goconst reporting below, but
      # goconst still COUNTS occurrences there, so a string used once in
      # production code and twice in its tests trips min-occurrences.
      ignore-tests: true
    revive:
      rules:
        - name: exported
          disabled: true

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - dupl
          - goconst
          - gocognit
          - gocyclo
          - gosec
          - unparam
