# Example workflow: drift detection via cron.
# Copy this file to your repository and adjust as needed.
name: Drift Detection

on:
  schedule:
    - cron: "0 8 * * 1-5" # weekdays at 08:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run drift detection
        uses: h13/gtm-users@789f3aeac69719c5fa1b09ce9200f55db507e06c # v1
        with:
          command: drift
          credentials: ${{ secrets.GTM_CREDENTIALS }}
          config: gtm-users.yaml
